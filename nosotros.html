    <!-- =====================================================
         ESTILOS DE NOSOTROS
    ====================================================== -->

    <style>

        /* =====================================================
           BASE
        ====================================================== */

        .nosotros-page {

            position: relative;

            overflow-x: hidden;

        }


        /* =====================================================
           HERO
        ====================================================== */

        .nosotros-hero {

            min-height: 680px;

            display: flex;

            align-items: center;

            position: relative;

            overflow: hidden;

            padding: 90px 0 75px;

            background:
                linear-gradient(
                    135deg,
                    var(--morado-profundo) 0%,
                    var(--morado-oscuro) 55%,
                    var(--morado) 100%
                );

            color: var(--blanco);

        }


        .nosotros-fondo {

            position: absolute;

            inset: 0;

            pointer-events: none;

            overflow: hidden;

        }


        .nosotros-orb {

            position: absolute;

            border-radius: 50%;

            filter: blur(5px);

            opacity: 0.7;

        }


        .nosotros-orb-1 {

            width: 420px;

            height: 420px;

            background:
                rgba(255, 255, 255, 0.05);

            top: -180px;

            right: -100px;

        }


        .nosotros-orb-2 {

            width: 300px;

            height: 300px;

            background:
                rgba(255, 255, 255, 0.04);

            bottom: -130px;

            left: -100px;

        }


        .nosotros-linea {

            position: absolute;

            width: 600px;

            height: 1px;

            background:
                rgba(255, 255, 255, 0.12);

            transform:
                rotate(-35deg);

            right: -120px;

            top: 35%;

        }


        .nosotros-hero-grid {

            position: relative;

            z-index: 2;

            display: grid;

            grid-template-columns: 1.1fr 0.9fr;

            gap: 70px;

            align-items: center;

        }


        .nosotros-etiqueta {

            display: inline-flex;

            align-items: center;

            gap: 10px;

            font-size: 11px;

            font-weight: 700;

            letter-spacing: 2px;

            margin-bottom: 22px;

            color:
                rgba(255, 255, 255, 0.78);

        }


        .nosotros-etiqueta::before {

            content: "";

            width: 35px;

            height: 2px;

            background: currentColor;

        }


        /* =====================================================
           TÍTULO
        ====================================================== */

        .nosotros-titulo {

            font-size:
                clamp(42px, 5vw, 68px);

            line-height:
                0.98;

            margin:
                0 0 28px;

            font-weight:
                800;

            letter-spacing:
                -2.5px;

            max-width:
                650px;

        }


        .nosotros-titulo span {

            display:
                block;

            color:
                var(--blanco);

        }


        .nosotros-titulo span:last-child {

            color:
                #E7B8F2;

        }


        .nosotros-intro {

            max-width:
                620px;

            font-size:
                17px;

            line-height:
                1.8;

            color:
                rgba(255, 255, 255, 0.82);

        }


        /* =====================================================
           TARJETA
        ====================================================== */

        .nosotros-card {

            position:
                relative;

            min-height:
                430px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

        }


        .nosotros-card-glow {

            position:
                absolute;

            width:
                330px;

            height:
                330px;

            border-radius:
                50%;

            background:
                rgba(255, 255, 255, 0.07);

            filter:
                blur(25px);

        }


        .nosotros-logo-card {

            position:
                relative;

            width:
                min(370px, 100%);

            min-height:
                370px;

            border:
                1px solid
                rgba(255, 255, 255, 0.18);

            background:
                rgba(255, 255, 255, 0.07);

            backdrop-filter:
                blur(12px);

            -webkit-backdrop-filter:
                blur(12px);

            border-radius:
                30px;

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            justify-content:
                center;

            padding:
                40px;

            box-shadow:
                0 30px 80px
                rgba(0, 0, 0, 0.22);

        }


        .nosotros-logo-card img {

            width:
                min(230px, 80%);

            height:
                auto;

            object-fit:
                contain;

            background:
                var(--blanco);

            padding:
                15px;

            border-radius:
                18px;

        }


        .nosotros-card-linea {

            width:
                70px;

            height:
                2px;

            margin:
                25px 0 17px;

            background:
                rgba(255, 255, 255, 0.8);

        }


        .nosotros-card-texto {

            font-size:
                10px;

            letter-spacing:
                2.5px;

            font-weight:
                700;

            text-align:
                center;

            color:
                rgba(255, 255, 255, 0.82);

        }


        /* =====================================================
           HISTORIA
        ====================================================== */

        .historia {

            padding:
                105px 0;

            background:
                var(--blanco);

        }


        .historia-grid {

            display:
                grid;

            grid-template-columns:
                0.7fr 1.3fr;

            gap:
                80px;

            align-items:
                start;

        }


        .historia-numero {

            font-size:
                clamp(80px, 11vw, 150px);

            line-height:
                0.8;

            font-weight:
                800;

            color:
                var(--morado);

            opacity:
                0.10;

            letter-spacing:
                -7px;

        }


        .historia-contenido h2 {

            font-size:
                clamp(32px, 4vw, 52px);

            line-height:
                1.05;

            margin:
                0 0 30px;

            font-weight:
                800;

            letter-spacing:
                -1.5px;

        }


        .historia-contenido p {

            font-size:
                16px;

            color:
                var(--gris);

            line-height:
                1.85;

            margin-bottom:
                20px;

        }


        .historia-contenido strong {

            color:
                var(--texto);

            font-weight:
                800;

        }


        /* =====================================================
           EVOLUCIÓN
        ====================================================== */

        .evolucion {

            padding:
                100px 0;

            background:
                var(--morado-suave);

        }


        .evolucion-titulo {

            max-width:
                800px;

            margin-bottom:
                55px;

        }


        .evolucion-titulo h2 {

            font-size:
                clamp(34px, 4vw, 55px);

            line-height:
                1.05;

            margin:
                0 0 18px;

            font-weight:
                800;

            letter-spacing:
                -1.5px;

        }


        .evolucion-titulo p:last-child {

            color:
                var(--gris);

            font-size:
                16px;

            line-height:
                1.75;

        }


        .evolucion-grid {

            display:
                grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap:
                22px;

        }


        .evolucion-card {

            padding:
                34px 30px;

            border:
                1px solid var(--borde);

            border-radius:
                22px;

            background:
                var(--blanco);

            transition:
                border-color 0.3s ease,
                box-shadow 0.3s ease,
                transform 0.3s ease;

        }


        .evolucion-card:hover {

            transform:
                translateY(-7px);

            border-color:
                rgba(144, 50, 187, 0.35);

            box-shadow:
                0 20px 45px
                rgba(60, 30, 70, 0.09);

        }


        .evolucion-card-numero {

            font-size:
                10px;

            font-weight:
                800;

            letter-spacing:
                2px;

            color:
                var(--morado);

            opacity:
                0.75;

        }


        .evolucion-card i {

            display:
                block;

            font-size:
                27px;

            color:
                var(--morado);

            margin:
                27px 0 18px;

        }


        .evolucion-card h3 {

            font-size:
                21px;

            margin:
                0 0 12px;

        }


        .evolucion-card p {

            color:
                var(--gris);

            font-size:
                13px;

            line-height:
                1.75;

            margin:
                0;

        }


        /* =====================================================
           VISIÓN
        ====================================================== */

        .vision {

            padding:
                115px 0;

            background:
                var(--blanco);

        }


        .vision-contenido {

            max-width:
                1000px;

            margin:
                auto;

            text-align:
                center;

        }


        .vision-contenido h2 {

            font-size:
                clamp(36px, 5vw, 65px);

            line-height:
                1.05;

            margin:
                0 0 30px;

            font-weight:
                800;

            letter-spacing:
                -2px;

        }


        .vision-contenido > p:not(.etiqueta):not(.vision-frase) {

            font-size:
                18px;

            color:
                var(--gris);

            line-height:
                1.8;

            max-width:
                820px;

            margin:
                auto;

        }


        .vision-frase {

            margin-top:
                50px !important;

            font-size:
                clamp(22px, 3vw, 36px) !important;

            color:
                var(--morado) !important;

            font-weight:
                800;

            line-height:
                1.2 !important;

        }


        /* =====================================================
           CTA
        ====================================================== */

        .nosotros-cta {

            padding:
                90px 0;

            background:
                var(--morado-suave);

        }


        .nosotros-cta-box {

            border-radius:
                28px;

            padding:
                65px 45px;

            background:
                linear-gradient(
                    145deg,
                    var(--morado),
                    var(--morado-oscuro)
                );

            color:
                var(--blanco);

            text-align:
                center;

            box-shadow:
                0 25px 60px
                rgba(103, 33, 135, 0.18);

        }


        .nosotros-cta-box .etiqueta {

            color:
                rgba(255, 255, 255, 0.72);

        }


        .nosotros-cta-box h2 {

            max-width:
                750px;

            margin:
                0 auto 22px;

            font-size:
                clamp(32px, 4vw, 52px);

            line-height:
                1.05;

        }


        .nosotros-cta-box p:not(.etiqueta) {

            max-width:
                650px;

            margin:
                0 auto 30px;

            color:
                rgba(255, 255, 255, 0.82);

            line-height:
                1.7;

            font-size:
                15px;

        }


        /* =====================================================
           MODAL CONTACTO
        ====================================================== */

        .modal-contacto {

            position: fixed;

            inset: 0;

            z-index: 9999;

            display: none;

            align-items: center;

            justify-content: center;

            padding: 25px;

            background:
                rgba(30, 15, 38, 0.72);

            backdrop-filter:
                blur(7px);

            -webkit-backdrop-filter:
                blur(7px);

            overflow-y: auto;

        }


        .modal-contacto.active {

            display: flex;

        }


        .modal-contacto-contenido {

            position: relative;

            width: min(650px, 100%);

            max-height: 92vh;

            overflow-y: auto;

            background:
                var(--blanco);

            border:
                1px solid var(--borde);

            border-radius:
                26px;

            padding:
                38px;

            box-shadow:
                0 30px 90px
                rgba(0, 0, 0, 0.28);

            animation:
                modalEntrada 0.25s ease;

        }


        @keyframes modalEntrada {

            from {

                opacity: 0;

                transform:
                    translateY(20px)
                    scale(0.98);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

            }

        }


        .modal-contacto-cerrar {

            position: absolute;

            top: 15px;

            right: 18px;

            width: 38px;

            height: 38px;

            border: none;

            border-radius: 50%;

            background:
                var(--morado-suave);

            color:
                var(--morado);

            font-size: 20px;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            transition:
                all 0.2s ease;

        }


        .modal-contacto-cerrar:hover {

            background:
                var(--morado);

            color:
                var(--blanco);

        }


        .modal-contacto-header {

            padding-right: 40px;

            margin-bottom: 25px;

        }


        .modal-contacto-header span {

            display: block;

            color:
                var(--morado);

            font-size: 10px;

            font-weight: 800;

            letter-spacing: 1.5px;

            margin-bottom: 8px;

        }


        .modal-contacto-header h2 {

            font-size: 30px;

            margin:
                0 0 8px;

        }


        .modal-contacto-header p {

            color:
                var(--gris);

            font-size: 13px;

            line-height: 1.6;

            margin: 0;

        }


        .modal-form-row {

            display:
                grid;

            grid-template-columns:
                1fr 1fr;

            gap:
                17px;

        }


        .modal-campo {

            margin-bottom:
                18px;

        }


        .modal-campo label {

            display:
                block;

            font-size:
                12px;

            font-weight:
                700;

            margin-bottom:
                7px;

        }


        .modal-campo input,
        .modal-campo select,
        .modal-campo textarea {

            width:
                100%;

            padding:
                13px 14px;

            border:
                1px solid #DED5E2;

            border-radius:
                11px;

            background:
                var(--blanco);

            color:
                var(--texto);

            font-family:
                inherit;

            font-size:
                13px;

            outline:
                none;

            transition:
                all 0.2s ease;

        }


        .modal-campo input:focus,
        .modal-campo select:focus,
        .modal-campo textarea:focus {

            border-color:
                var(--morado);

            box-shadow:
                0 0 0 3px
                rgba(144, 50, 187, 0.10);

        }


        .modal-campo textarea {

            min-height:
                110px;

            resize:
                vertical;

        }


        .modal-campo textarea::placeholder,
        .modal-campo input::placeholder {

            color:
                var(--gris-claro);

        }


        .modal-boton {

            width:
                100%;

            min-height:
                50px;

            border:
                none;

            cursor:
                pointer;

        }


        .modal-estado {

            min-height:
                20px;

            margin-top:
                12px;

            text-align:
                center;

            font-size:
                11px;

            font-weight:
                700;

        }


        .modal-privacidad {

            color:
                #99939C;

            text-align:
                center;

            font-size:
                9px;

            line-height:
                1.5;

            margin:
                12px 0 0;

        }


        /* =====================================================
           ANIMACIONES AL HACER SCROLL
        ====================================================== */

        .anim-scroll {

            opacity: 0;

            transform:
                translateY(45px);

            transition:
                opacity 0.8s ease,
                transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);

        }


        .anim-scroll.mostrar {

            opacity: 1;

            transform:
                translateY(0);

        }


        /* =====================================================
           ANIMACIÓN DESDE LA IZQUIERDA
        ====================================================== */

        .anim-left {

            opacity: 0;

            transform:
                translateX(-55px);

            transition:
                opacity 0.8s ease,
                transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);

        }


        .anim-left.mostrar {

            opacity: 1;

            transform:
                translateX(0);

        }


        /* =====================================================
           ANIMACIÓN DESDE LA DERECHA
        ====================================================== */

        .anim-right {

            opacity: 0;

            transform:
                translateX(55px);

            transition:
                opacity 0.8s ease,
                transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);

        }


        .anim-right.mostrar {

            opacity: 1;

            transform:
                translateX(0);

        }


        /* =====================================================
           ANIMACIÓN DE TARJETAS
        ====================================================== */

        .anim-card {

            opacity: 0;

            transform:
                translateY(40px)
                scale(0.96);

            transition:
                opacity 0.7s ease,
                transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);

        }


        .anim-card.mostrar {

            opacity: 1;

            transform:
                translateY(0)
                scale(1);

        }


        /* =====================================================
           RETRASOS PARA LAS TARJETAS
        ====================================================== */

        .anim-delay-1 {

            transition-delay:
                0.10s;

        }


        .anim-delay-2 {

            transition-delay:
                0.20s;

        }


        .anim-delay-3 {

            transition-delay:
                0.30s;

        }


        .anim-delay-4 {

            transition-delay:
                0.40s;

        }


        /* =====================================================
           ANIMACIÓN ESPECIAL DEL 2020
        ====================================================== */

        .historia-numero.anim-2020 {

            opacity:
                0.10;

            color:
                var(--morado);

            transform:
                translateY(45px);

            transition:
                transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);

        }


        .historia-numero.anim-2020.mostrar {

            opacity:
                0.10;

            color:
                var(--morado);

            transform:
                translateY(0);

        }


        /* =====================================================
           REDUCCIÓN DE MOVIMIENTO
        ====================================================== */

        @media (prefers-reduced-motion: reduce) {

            .anim-scroll,
            .anim-left,
            .anim-right,
            .anim-card,
            .historia-numero.anim-2020 {

                opacity: 1;

                transform: none;

                transition: none;

            }

        }


        /* =====================================================
           RESPONSIVE
        ====================================================== */

        @media (max-width: 900px) {

            .nosotros-hero {

                min-height:
                    auto;

                padding:
                    85px 0 70px;

            }


            .nosotros-hero-grid,
            .historia-grid {

                grid-template-columns:
                    1fr;

                gap:
                    45px;

            }


            .nosotros-hero-grid > div:first-child {

                text-align:
                    center;

            }


            .nosotros-etiqueta {

                margin-bottom:
                    18px;

            }


            .nosotros-intro {

                margin-left:
                    auto;

                margin-right:
                    auto;

            }


            .nosotros-card {

                min-height:
                    360px;

            }


            .nosotros-logo-card {

                width:
                    340px;

                min-height:
                    340px;

            }


            .historia-numero {

                font-size:
                    100px;

            }


            .evolucion-grid {

                grid-template-columns:
                    1fr 1fr;

            }

        }


        @media (max-width: 600px) {

            .nosotros-hero {

                padding:
                    75px 0 60px;

            }


            .nosotros-titulo {

                font-size:
                    40px;

                letter-spacing:
                    -1.5px;

                line-height:
                    1;

            }


            .nosotros-intro {

                font-size:
                    15px;

                line-height:
                    1.75;

            }


            .nosotros-etiqueta {

                font-size:
                    9px;

                letter-spacing:
                    1.4px;

            }


            .nosotros-card {

                min-height:
                    320px;

            }


            .nosotros-logo-card {

                width:
                    290px;

                min-height:
                    290px;

                padding:
                    25px;

                border-radius:
                    24px;

            }


            .nosotros-logo-card img {

                width:
                    200px;

            }


            .nosotros-card-texto {

                font-size:
                    8px;

                letter-spacing:
                    1.8px;

            }


            .historia,
            .evolucion,
            .vision,
            .nosotros-cta {

                padding:
                    70px 0;

            }


            .historia-numero {

                font-size:
                    75px;

                letter-spacing:
                    -4px;

            }


            .historia-contenido h2 {

                font-size:
                    32px;

            }


            .historia-contenido p {

                font-size:
                    14px;

            }


            .evolucion-titulo h2 {

                font-size:
                    34px;

            }


            .evolucion-titulo p:last-child {

                font-size:
                    14px;

            }


            .evolucion-grid {

                grid-template-columns:
                    1fr;

            }


            .evolucion-card {

                padding:
                    28px 24px;

            }


            .vision-contenido h2 {

                font-size:
                    34px;

                letter-spacing:
                    -1px;

            }


            .vision-contenido > p:not(.etiqueta):not(.vision-frase) {

                font-size:
                    15px;

            }


            .vision-frase {

                font-size:
                    25px !important;

            }


            .nosotros-cta-box {

                padding:
                    45px 25px;

                border-radius:

<!-- =====================================================
     ANIMACIONES AL HACER SCROLL
===================================================== -->

<script>

document.addEventListener("DOMContentLoaded", function () {


    const elementosAnimados = document.querySelectorAll(
        ".anim-scroll, " +
        ".anim-left, " +
        ".anim-right, " +
        ".anim-card, " +
        ".anim-2020"
    );


    const observer = new IntersectionObserver(

        function (entradas) {


            entradas.forEach(function (entrada) {


                if (entrada.isIntersecting) {

                    entrada.target.classList.add("mostrar");

                }


                else {

                    entrada.target.classList.remove("mostrar");

                }

            });

        },


        {

            threshold: 0.15

        }

    );


    elementosAnimados.forEach(function (elemento) {

        observer.observe(elemento);

    });


});

</script>
